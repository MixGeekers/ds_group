&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHello all,\\u003c/p\\u003e\\n\\u003cp\\u003eI’m trying to automate the process of clicking the “OK” button in the macOS file access permission dialogs that appear when an app requests access to a folder (e.g., Desktop).\\u003c/p\\u003e\\n\\u003cp\\u003eFor example, the dialog typically looks like this:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cem\\u003e“MyApplication.app” would like to access files in your Desktop folder.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eButtons: “Don’t Allow”, “OK”\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eIn my case, I don’t really care which button is pressed, but ideally, I’d like the “OK” button to be clicked automatically.\\u003c/p\\u003e\\n\\u003cp\\u003eThe goal is to avoid manual intervention in \\u003cstrong\\u003eSecurity \\u0026amp; Privacy\\u003c/strong\\u003e settings, since the users do not have administrator passwords.\\u003c/p\\u003e\\n\\u003cp\\u003eAny suggestions on how to achieve this programmatically?\\u003c/p\\u003e\\n\\u003cp\\u003eThanks in advance,\\u003cbr\\u003e\\nJeff\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2025-01-25T07:30:43.211Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:264,\&quot;reads\&quot;:35,\&quot;readers_count\&quot;:34,\&quot;score\&quot;:1327.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:76710,\&quot;topic_slug\&quot;:\&quot;automating-button-click-in-macos-file-access-permission-dialog\&quot;,\&quot;display_username\&quot;:null,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\& ite permissions on the copied file on the Desktop\\nset desktopFolder to \\\&quot;/Users/\\\&quot; \\u0026amp; uName \\u0026amp; \\\&quot;/Desktop/Illustrator.qlgenerator\\\&quot;\\ndo shell script \\\&quot;sudo chmod -R 777 \\\&quot; \\u0026amp; quoted form of desktopFolder with administrator privileges\\n\\n-- Step 3: Open \\\&quot;Illustrator.qlgenerator\\\&quot; by right-clicking and showing package contents\\ntell application \\\&quot;Finder\\\&quot;\\n\\t-- Use the absolute path to the desktop and the Illustrator.qlgenerator file\\n\\tset illustratorFilePath to \\\&quot;/Users/\\\&quot; \\u0026amp; uName \\u0026amp; \\\&quot;/Desktop/Illustrator.qlgenerator\\\&quot;\\n\\tset illustratorFile to POSIX file illustratorFilePath as alias\\n\\topen illustratorFile\\n\\tdelay 1 -- Allow Finder to open the file\\n\\tset packageContents to folder \\\&quot;Contents\\\&quot; of illustratorFile\\nend tell\\n\\n\\n---Press the \\\&quot;OK\\\&quot; button\\n\\n\\n-- Step 4: Open \\\&quot;Info.plist\\\&quot; in the \\\&quot;Contents\\\&quot; folder with TextEdit\\ntell application \\\&quot;TextEdit\\\&quot;\\n\\t-- Build the POSIX path to Info.plist\\n\\tset plistPath to illustratorFilePath \\u0026amp; \\\&quot;/Contents/Info.plist\\\&quot;\\n\\t\\t-- Step 5: Change the file permissions to be writable (using sudo)\\n\\tdo shell script \\\&quot;sudo chmod 777 \\\&quot; \\u0026amp; quoted form of plistPath with administrator privileges\\n\\t-- Open Info.plist\\n\\topen POSIX file plistPath\\nend tell\\n\\n-- Step 6: Delete all text in the opened Info.plist\\ntell application \\\&quot;TextEdit\\\&quot;\\n\\tset the text of document 1 to \\\&quot;\\\&quot;\\nend tell\\n\\n-- Step 7: Replace content with new Info.plist XML\\nset newPlistContent to \\\&quot;\\u0026lt;?xml version=\\\\\\\&quot;1.0\\\\\\\&quot; encoding=\\\\\\\&quot;UTF-8\\\\\\\&quot;?\\u0026gt;\\n\\u0026lt;!DOCTYPE plist PUBLIC \\\\\\\&quot;-//Apple//DTD PLIST 1.0//EN\\\\\\\&quot; http://www.apple.com/DTDs/Property string\\u0026gt;1330\\u0026lt;/string\\u0026gt;\\n\\u0026lt;key\\u0026gt;DTXcodeBuild\\u0026lt;/key\\u0026gt;\\n\\u0026lt;string\\u0026gt;13E6049a\\u0026lt;/string\\u0026gt;\\n\\u0026lt;key\\u0026gt;LSMinimumSystemVersion\\u0026lt;/key\\u0026gt;\\n\\u0026lt;string\\u0026gt;12.7\\u0026lt;/string\\u0026gt;\\n\\u0026lt;key\\u0026gt;QLNeedsToBeRunInMainThread\\u0026lt;/key\\u0026gt;\\n\\u0026lt;false/\\u0026gt;\\n\\u0026lt;key\\u0026gt;QLPreviewHeight\\u0026lt;/key\\u0026gt;\\n\\u0026lt;real\\u0026gt;600\\u0026lt;/real\\u0026gt;\\n\\u0026lt;key\\u0026gt;QLPreviewWidth\\u0026lt;/key\\u0026gt;\\n\\u0026lt;real\\u0026gt;800\\u0026lt;/real\\u0026gt;\\n\\u0026lt;key\\u0026gt;QLSupportsConcurrentRequests\\u0026lt;/key\\u0026gt;\\n\\u0026lt;true/\\u0026gt;\\n\\u0026lt;key\\u0026gt;QLThumbnailMinimumSize\\u0026lt;/key\\u0026gt;\\n\\u0026lt;integer\\u0026gt;0\\u0026lt;/integer\\u0026gt;\\n\\u0026lt;/dict\\u0026gt;\\n\\u0026lt;/plist\\u0026gt;\\\&quot;\\n\\n-- Step 8: Paste new content into Info.plist\\ntell application \\\&quot;TextEdit\\\&quot;\\n\\tset the text of document 1 to newPlistContent\\nend tell\\n\\n-- Step 9: Save the modified Info.plist back into the \\\&quot;Contents\\\&quot; folder on the Desktop\\nset plistFilePath to illustratorFilePath \\u0026amp; \\\&quot;/Contents/Info.plist\\\&quot;\\ntell application \\\&quot;TextEdit\\\&quot;\\n\\tsave document 1 in POSIX file plistFilePath\\nend tell\\n\\n-- Step 10: Close the TextEdit document without saving\\ntell application \\\&quot;TextEdit\\\&quot;\\n\\tclose document 1 saving no\\nend tell\\n\\n-- Step 11: Move the \\\&quot;Illustrator.qlgenerator\\\&quot; folder back to the QuickLook directory\\ndo shell script \\\&quot;sudo mv /Users/\\\&quot; \\u0026amp; uName \\u0026amp; \\\&quot;/Desktop/Illustrator.qlgenerator /Library/QuickLook/\\\&quot; with administrator privileges\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2025-01-2         <div class='post' itemprop='articleBody'>
          <p>Hello all,</p>
<p>I’m trying to automate the process of clicking the “OK” button in the macOS file access permission dialogs that appear when an app requests access to a folder (e.g., Desktop).</p>
<p>For example, the dialog typically looks like this:</p>
<p><em>“MyApplication.app” would like to access files in your Desktop folder.</em></p>
<ul>
<li>Buttons: “Don’t Allow”, “OK”</li>
</ul>
<p>In my case, I don’t really care which button is pressed, but ideally, I’d like the “OK” button to be clicked automatically.</p>
<p>The goal is to avoid manual intervention in <strong>Security &amp; Privacy</strong> settings, since the users do not have administrator passwords.</p>
<p>Any suggestions on how to achieve this programmatically?</p>
<p>Thanks in advance,<br>
Jeff</p>

        <div class='post' itemprop='articleBody'>
          <p>Hello robertfern,</p>
<p>Below is a copy of the script, which only requires permission to control the Desktop when compiled as an “Application” script:</p>
<pre><code class="lang-applescript">
-- Define username and password for the sudo command
set uName to "administrator" -- Replace with your actual username
set pass1 to "myPassWord"
try
	-- Step 1: Copy "Illustrator.qlgenerator" from "/System/Library/QuickLook" to the Desktop
	do shell script "cp -R /System/Library/QuickLook/Illustrator.qlgenerator /Users/" &amp; uName &amp; "/Desktop/Illustrator.qlgenerator" user name uName password pass1 with administrator privileges
on error
	set uName to "Administrator"
	do shell script "cp -R /System/Library/QuickLook/Illustrator.qlgenerator /Users/" &amp; uName &amp; "/Desktop/Illustrator.qlgenerator" user name uName password pass1 with administrator privileges
end try

-- Step 2: Ensure full read/write permissions on the copied file on the Desktop
set desktopFolder to "/Users/" &amp; uName &amp; "/Desktop/Illustrator.qlgenerator"
do shell script "sudo chmod -R 777 " &amp; quoted form of desktopFolder with administrator privileges

-- Step 3: Open "Illustrator.qlgenerator" by right-clicking and showing package contents
tell application "Finder"
	-- Use the absolute path to the desktop and the Illustrator.qlgenerator file
	set illustratorFilePath to "/Users/" &amp; uName &amp; "/Desktop/Illustrator.qlgenerator"
	set illustratorFile to POSIX file illustratorFilePath as alias
	open illustratorFile
	delay 1 -- Allow Finder to open the file
	set packageContents to folder "Contents" of illustratorFile
end tell


---Press the "OK" button


-- Step 4: Open "Info.plist" in the "Contents" folder with TextEdit
tell application "TextEdit"
	-- Build the POSIX path to Info.plist
	set plistPath to illustratorFilePath &amp; "/Contents/Info.plist"
		-- Step 5: Change the file permissions to be writable (using sudo)
	do shell script "sudo chmod 777 " &amp; quoted form of plistPath with administrator privileges
	-- Open Info.plist
	open POSIX file plistPath
end tell

-- Step 6: Delete all text in the opened Info.plist
tell application "TextEdit"
	set the text of document 1 to ""
end tell

-- Step 7: Replace content with new Info.plist XML
set newPlistContent to "&lt;?xml version=\"1.0\" encoding=\"UTF-8\"?&gt;
&lt;!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" http://www.apple.com/DTDs/PropertyList-1.0.dtd&gt;
&lt;plist version=\"1.0\"&gt;
&lt;dict&gt;
&lt;key&gt;BuildMachineOSBuild&lt;/key&gt;
&lt;string&gt;20A241133&lt;/string&gt;
&lt;key&gt;CFBundleDevelopmentRegion&lt;/key&gt;
&lt;string&gt;English&lt;/string&gt;

&lt;array&gt;

&lt;array&gt;
&lt;string&gt;com.adobe.encapsulated-postscript&lt;/string&gt;
&lt;/array&gt;
&lt;/dict&gt;
&lt;/array&gt;
&lt;key&gt;CFBundleExecutable&lt;/key&gt;
&lt;string&gt;Illustrator&lt;/string&gt;
&lt;key&gt;CFBundleGetInfoString&lt;/key&gt;

&lt;/array&gt;

&lt;key&gt;CFPlugInDynamicRegisterFunction&lt;/key&gt;
&lt;string&gt;&lt;/string&gt;

&lt;/dict&gt;
&lt;/plist&gt;"

-- Step 8: Paste new content into Info.plist
tell application "TextEdit"
	set the text of document 1 to newPlistContent
end tell

-- Step 9: Save the modified Info.plist back into the "Contents" folder on the Desktop
set plistFilePath to illustratorFilePath &amp; "/Contents/Info.plist"
tell application "TextEdit"
	save document 1 in POSIX file plistFilePath
end tell

-- Step 10: Close the TextEdit document without saving
tell application "TextEdit"
	close document 1 saving no
end tell

-- Step 11: Move the "Illustrator.qlgenerator" folder back to the QuickLook directory
do shell script "sudo mv /Users/" &amp; uName &amp; "/Desktop/Illustrator.qlgenerator /Library/QuickLook/" with administrator privileges

        <div class='post' itemprop='articleBody'>
          <p>So far just looking at your script, it only works if the User who is logged in is an Administrator.</p>
<p>Also had problems on this…</p>
<pre><code class="lang-applescript">set desktopFolder to "/Users/" &amp; uName &amp; "/Desktop/Illustrator.qlgenerator"
do shell script "sudo chmod -R 777 " &amp; quoted form of desktopFolder with administrator privileges
</code></pre>
<p>it gives an error</p>
<blockquote>
<p>chmod: Unable to change file mode on /Users/robert/Desktop/Illustrator.qlgenerator: Operation not permitted<br>
chmod: /Users/robert/Desktop/Illustrator.qlgenerator: Operation not permitted<br>
chmod: Unable to change file mode on /Users/robert/Desktop/Illustrator.qlgenerator: Operation not permitted</p>
</blockquote>
<p>BTW, don’t need 'sudo ’ in front of the ‘chmod’. Thats what ‘with administrator privileges’ does. Like so…</p>
<pre><code class="lang-applescript">do shell script "chmod -R 777 " &amp; quoted form of desktopFolder user name uName password pass1 with administrator privileges
</code></pre>
<p>I also put in the username and password</p>
